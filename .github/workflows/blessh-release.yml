# ConnectBot blessh: signed release builds of this fork. Runs on the `release`
# branch (the `ble` branch plus fork-only files) and on tags `blessh-android-r*`, which
# publish a GitHub release. Upstream's workflows are disabled in this
# repository.
name: blessh-release

on:
  push:
    branches: [release]
    tags: ['blessh-android-r*']
  workflow_dispatch:

# A newer push to the branch makes a running build of it pointless; tag
# builds publish releases and always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  # The checks upstream's CI runs on a pull request (`./gradlew check`: lint
  # and the unit tests of both flavors), split by flavor, which keeps each
  # job within a runner's memory. They take about 15 minutes per flavor, so
  # they run for release tags and on demand; pushes to the branch get the
  # apk job, and development is checked locally first.
  upstream-checks:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Oss, Google]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      # Disk space for the build and swap for the JVMs: remove preinstalled
      # toolchains this build does not use.
      - name: Disk space and swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          sudo fallocate -l 4G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 >/dev/null
          sudo swapon /swapfile2
          free -g
          df -h /

      - name: Lint and unit tests (${{ matrix.flavor }})
        run: >
          ./gradlew --no-configuration-cache --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" -Pkotlin.daemon.jvmargs=-Xmx2g
          :app:lint${{ matrix.flavor }}Debug
          :app:test${{ matrix.flavor }}DebugUnitTest :mosh:test${{ matrix.flavor }}DebugUnitTest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: check-reports-${{ matrix.flavor }}
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/
          if-no-files-found: ignore

  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      # Upstream's Spotless setup checks files changed since origin/main;
      # here that is the upstream mirror, so exactly the BLE changes.
      - name: Upstream base for formatting checks
        run: git fetch --no-tags origin upstream-main:refs/remotes/origin/main

      # What upstream's PR checks would require of the BLE changes. On
      # failure the fixes Spotless would make are kept as an artifact.
      - name: Formatting
        run: |
          if ! ./gradlew --no-configuration-cache spotlessCheck; then
            ./gradlew --no-configuration-cache spotlessApply
            git diff > spotless.patch
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: spotless-patch
          path: spotless.patch
          if-no-files-found: ignore

      - name: Unit tests (BLE)
        run: ./gradlew --no-configuration-cache :app:testOssDebugUnitTest --tests 'org.connectbot.transport.ble.*' --tests 'org.connectbot.transport.BleSshTest'

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      # The app's build already signs release builds when these properties
      # are set.
      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_keystoreFile: ${{ runner.temp }}/release.p12
          ORG_GRADLE_PROJECT_keystorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keystoreAlias: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
        run: ./gradlew --no-configuration-cache --init-script ci/blessh-release.init.gradle :app:assembleOssRelease

      - name: Collect APK
        run: |
          rm -f "$RUNNER_TEMP/release.p12"
          mkdir -p out
          name=connectbot-blessh-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}
          cp app/build/outputs/apk/oss/release/*.apk "out/$name.apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "out/$name.apk" | grep -E 'SHA-256|Signer #1 certificate DN'
          "$tools/aapt2" dump badging "out/$name.apk" | grep -E "^package:|application-label:"
          (cd out && sha256sum *.apk > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connectbot-blessh-apk
          path: out/

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          printf 'ConnectBot blessh, based on ConnectBot %s plus the blessh Bluetooth LE transport.\n\nSigning certificate SHA-256: D0:94:1A:C1:69:B6:D0:D5:49:65:74:9B:BD:AD:8D:D3:73:32:67:EF:3C:F6:8D:AE:2A:4D:81:61:40:34:B1:64\n' "$base" > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --title "ConnectBot blessh ${GITHUB_REF_NAME#blessh-android-}" --notes-file notes.md
